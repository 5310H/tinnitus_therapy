<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" href="icon-192.png" type="image/png">
    <title>Hearing Range Test</title>
    <link rel="stylesheet" href="style.css">
    <script src="storage.js"></script>
    <script src="nav.js"></script>
</head>

<body>
    <div class="panel">
        <h1>Hearing Range Test</h1>
        <p>Tap each button to test audibility</p>
        <div class="card">
            <div class="section-title">Low Frequencies</div>
            <button class="button" onclick="play(20)">20 Hz</button>
            <button class="button" onclick="play(40)">40 Hz</button>
            <button class="button" onclick="play(80)">80 Hz</button>
            <button class="button" onclick="play(125)">125 Hz</button>
            <button class="button" onclick="play(250)">250 Hz</button>

            <div class="section-title">Mid Frequencies</div>
            <button class="button" onclick="play(500)">500 Hz</button>
            <button class="button" onclick="play(750)">750 Hz</button>
            <button class="button" onclick="play(1000)">1 kHz</button>
            <button class="button" onclick="play(1500)">1.5 kHz</button>
            <button class="button" onclick="play(2000)">2 kHz</button>

            <div class="section-title">High Frequencies</div>
            <button class="button" onclick="play(3000)">3 kHz</button>
            <button class="button" onclick="play(4000)">4 kHz</button>
            <button class="button" onclick="play(6000)">6 kHz</button>
            <button class="button" onclick="play(8000)">8 kHz</button>

            <div class="section-title">Very High Frequencies</div>
            <button class="button" onclick="play(10000)">10 kHz</button>
            <button class="button" onclick="play(12000)">12 kHz</button>
            <button class="button" onclick="play(14000)">14 kHz</button>
            <button class="button" onclick="play(16000)">16 kHz</button>
            <button class="button" onclick="play(18000)">18 kHz</button>
            <button class="button" onclick="play(20000)">20 kHz</button>

            <div
                style="margin-top: 25px; border-top: 1px dashed var(--border); padding-top: 20px; display: flex; flex-direction: column; gap: 10px;">
                <button class="button" onclick="exportClinicalSettings()">Clinical Export (.txt)</button>
                <button class="button" style="background:var(--accent); color:white;"
                    onclick="generatePDFReport()">Download PDF Report</button>
                <a class="button"
                    style="width:100%; margin-top:10px; border-color: var(--text-dim); color: var(--text-dim); text-decoration: none; display: flex; align-items: center; justify-content: center;"
                    href="user_manual.html#sec-18" target="_blank">Open Manual for this Tool</a>
                <button class="button email-audiologist-btn"
                    style="background:var(--accent); color:white; display:none;" onclick="emailToAudiologist()">Email to
                    Audiologist</button>
                <button class="button"
                    style="width:100%; margin-top:10px; border-color: var(--text-dim); color: var(--text-dim);"
                    onclick="resetToDefaults()">Reset to Defaults</button>
            </div>
        </div>

        <script>
            window.onload = () => {
                initNav("This tool allows you to check audibility across a wide spectrum. <b>Note:</b> This is a digital exploration tool and does not replace a clinical audiogram.");
            };
            let ctx = null;
            let osc = null;

            /* PLAY TONE */
            function play(freq) {
                if (!ctx) ctx = new (window.AudioContext || window.webkitAudioContext)();
                if (ctx.state === 'suspended') ctx.resume();

                stopTone(); // ensure only one tone plays

                osc = ctx.createOscillator();
                osc.type = "sine";
                osc.frequency.value = freq;

                const gain = ctx.createGain();
                gain.gain.value = 0.2;

                osc.connect(gain).connect(ctx.destination);
                osc.start();
            }

            /* STOP TONE */
            function stopTone() {
                if (osc) {
                    try { osc.stop(); } catch (e) { }
                    osc = null;
                }
            }

            function resetToDefaults() {
                if (confirm("Reset all settings for Hearing Test to their defaults?")) {
                    resetModuleSettings(['ht_']);
                }
            }
            function getReportData() {
                return { "Test Performed": "Hearing Range Audibility Test" };
            }

            function exportClinicalSettings() {
                const reportData = getClinicalReportData("Hearing Range Test", getReportData());
                // Fetch AI summary and add to reportData
                getClinicalSummary().then(aiSummaryText => {
                    reportData.aiSummary = aiSummaryText;
                    const report = generateClinicalReportText(reportData);
                    const blob = new Blob([report], { type: 'text/plain' });
                    const a = document.createElement('a'); a.href = URL.createObjectURL(blob);
                    a.download = `tinnitus_clinical_hearing_test.txt`; a.click();
                    alert("Clinical report downloaded. Please check your browser's Downloads folder.");
                });
            }

            async function generatePDFReport() {
                const reportData = getClinicalReportData("Hearing Range Test", getReportData());
                // Fetch AI summary and add to reportData
                const aiSummaryText = await getClinicalSummary();
                reportData.aiSummary = aiSummaryText;
                const htmlContent = generateClinicalReportHtml(reportData);

                const tempDiv = document.createElement('div');
                tempDiv.innerHTML = htmlContent;
                document.body.appendChild(tempDiv);

                const isDark = document.documentElement.classList.contains('light-mode');
                if (!isDark) document.documentElement.classList.add('light-mode');

                const opt = {
                    margin: [20, 15], filename: 'tinnitus_clinical_hearing_test.pdf', image: { type: 'jpeg', quality: 0.98 },
                    html2canvas: { scale: 2, useCORS: true, backgroundColor: '#ffffff', scrollY: 0 },
                    jsPDF: { unit: 'mm', format: 'a4', orientation: 'portrait' }
                };
                await html2pdf().set(opt).from(tempDiv).save();

                if (!isDark) document.documentElement.classList.remove('light-mode');
                document.body.removeChild(tempDiv);
            }

            function emailToAudiologist() {
                const email = loadSetting('audiologist_email', '');
                if (!email) return alert("Please set your audiologist's email on the Home page.");
                // Fetch AI summary and add to reportData
                getClinicalSummary().then(async aiSummaryText => {
                    const reportData = getClinicalReportData("Hearing Range Test", getReportData());
                    reportData.aiSummary = aiSummaryText;
                    const report = generateClinicalReportText(reportData);
                    window.location.href = `mailto:${email}?subject=Tinnitus Clinical Report&body=${encodeURIComponent(report)}`;
                    alert("Email client opened. Please review and send the clinical report draft.");
                });
            }
        </script>

</body>

</html>
