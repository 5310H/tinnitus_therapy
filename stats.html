<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Progress & Stats - Tinnitus Therapy</title>
<script src="storage.js"></script>
<script src="nav.js"></script>
<link rel="stylesheet" href="style.css">
<style>
    .chart-container {
        background: var(--card-bg);
        padding: 20px;
        border-radius: 12px;
        border: 1px solid var(--border);
        margin-top: 20px;
        text-align: center;
    }
    #thiChart {
        width: 100%;
        height: 300px;
        background: var(--bg);
        border: 1px solid var(--border);
        border-radius: 8px;
        margin-top: 15px;
    }
    .chart-legend {
        display: flex;
        justify-content: center;
        gap: 20px;
        margin-top: 15px;
        font-size: 0.85rem;
        color: var(--text-dim);
    }
    .legend-item {
        display: flex;
        align-items: center;
    }
    .legend-color {
        width: 15px;
        height: 15px;
        border-radius: 3px;
        margin-right: 8px;
    }
    .grade-band {
        position: absolute;
        left: 0;
        right: 0;
        opacity: 0.1;
        z-index: 0;
    }
    .grade-slight { background-color: #4CAF50; } /* Green */
    .grade-mild { background-color: #8BC34A; } /* Light Green */
    .grade-moderate { background-color: #FFC107; } /* Amber */
    .grade-severe { background-color: #FF9800; } /* Orange */
    .grade-catastrophic { background-color: #F44336; } /* Red */
</style>
</head>
<body>
<div class="panel">
    <h1>Progress & Statistics</h1>
    <p class="info">Track your Tinnitus Handicap Inventory (THI) scores over time.</p>

    <div class="chart-container">
        <h2>THI Score Trend</h2>
        <p class="info">Lower scores indicate less tinnitus-related distress.</p>
        <div style="position: relative; height: 300px;">
            <div class="grade-band grade-slight" style="bottom: 0; height: 16%;"></div>
            <div class="grade-band grade-mild" style="bottom: 16%; height: 18%;"></div>
            <div class="grade-band grade-moderate" style="bottom: 34%; height: 20%;"></div>
            <div class="grade-band grade-severe" style="bottom: 54%; height: 20%;"></div>
            <div class="grade-band grade-catastrophic" style="bottom: 74%; height: 26%;"></div>
            <canvas id="thiChart"></canvas>
        </div>
        <div class="chart-legend">
            <div class="legend-item"><span class="legend-color" style="background-color: #4CAF50;"></span>Slight (0-16)</div>
            <div class="legend-item"><span class="legend-color" style="background-color: #8BC34A;"></span>Mild (18-36)</div>
            <div class="legend-item"><span class="legend-color" style="background-color: #FFC107;"></span>Moderate (38-56)</div>
            <div class="legend-item"><span class="legend-color" style="background-color: #FF9800;"></span>Severe (58-76)</div>
            <div class="legend-item"><span class="legend-color" style="background-color: #F44336;"></span>Catastrophic (78-100)</div>
        </div>
    </div>
</div>

<script>
window.onload = () => {
    initNav(`
        <b>THI Scores:</b> Regularly taking the Tinnitus Handicap Inventory helps you objectively track your progress in habituation.<br><br>
        <b>Interpretation:</b> A downward trend in your score indicates successful coping and reduced distress, even if the tinnitus sound itself hasn't changed.
    `);
    drawThiChart();
};

function drawThiChart() {
    const rawScores = getDistressScores(); // Retrieve scores from storage.js
    const canvas = document.getElementById('thiChart');
    const ctx = canvas.getContext('2d');

    // Adjust canvas for high-DPI displays
    const dpi = window.devicePixelRatio || 1;
    canvas.width = canvas.clientWidth * dpi;
    canvas.height = canvas.clientHeight * dpi;
    ctx.scale(dpi, dpi);

    // Prepare data: filter out invalid scores, sort by date, convert to suitable format
    const data = Object.entries(rawScores)
        .filter(([, score]) => !isNaN(parseInt(score))) // Filter out non-numeric scores
        .sort(([dateA], [dateB]) => new Date(dateA).getTime() - new Date(dateB).getTime())
        .map(([date, score]) => ({ date: new Date(date), score: parseInt(score) }))
        // Filter out duplicate dates, keeping the last score for that day
        .filter((entry, index, self) => 
            index === self.findIndex(t => t.date.toDateString() === entry.date.toDateString())
        );

    if (data.length < 2) {
        ctx.clearRect(0, 0, canvas.width, canvas.height); // Clear any previous drawing
        ctx.font = '16px Arial';
        ctx.fillStyle = 'var(--text-dim)';
        ctx.textAlign = 'center';
        ctx.fillText('Not enough data to draw chart. Take the THI quiz!', canvas.clientWidth / 2, canvas.clientHeight / 2);
        return;
    }

    const paddingLeft = 40;
    const paddingRight = 10;
    const paddingTop = 10;
    const paddingBottom = 40;

    const chartWidth = canvas.clientWidth - paddingLeft - paddingRight;
    const chartHeight = canvas.clientHeight - paddingTop - paddingBottom;

    const minDate = data[0].date.getTime();
    const maxDate = data[data.length - 1].date.getTime();
    const dateRange = maxDate === minDate ? 1 : maxDate - minDate; // Avoid division by zero for single data point

    // Y-axis (scores 0-100)
    const yScale = chartHeight / 100;

    ctx.clearRect(0, 0, canvas.width, canvas.height);

    // Draw X-axis (Dates)
    ctx.strokeStyle = 'var(--border)';
    ctx.beginPath();
    ctx.moveTo(paddingLeft, paddingTop + chartHeight);
    ctx.lineTo(paddingLeft + chartWidth, paddingTop + chartHeight);
    ctx.stroke();

    // Draw Y-axis (Scores)
    ctx.beginPath();
    ctx.moveTo(paddingLeft, paddingTop);
    ctx.lineTo(paddingLeft, paddingTop + chartHeight);
    ctx.stroke();

    // Draw Y-axis labels (0, 25, 50, 75, 100) and horizontal grid lines
    ctx.font = '12px Arial';
    ctx.fillStyle = 'var(--text-dim)';
    ctx.textAlign = 'right';
    ctx.textBaseline = 'middle'; // Align text vertically

    for (let i = 0; i <= 4; i++) {
        const scoreLabel = i * 25;
        const y = paddingTop + chartHeight - (scoreLabel * yScale);
        ctx.fillText(scoreLabel, paddingLeft - 5, y); // Label to the left of Y-axis

        ctx.beginPath();
        ctx.strokeStyle = 'var(--border)';
        ctx.setLineDash([2, 2]); // Dotted line
        ctx.moveTo(paddingLeft, y);
        ctx.lineTo(paddingLeft + chartWidth, y);
        ctx.stroke();
    }
    ctx.setLineDash([]); // Reset line dash for subsequent drawings

    // Draw X-axis labels (Dates)
    ctx.textAlign = 'center';
    ctx.textBaseline = 'top'; // Align text vertically
    const numLabels = Math.min(data.length, 5); // Limit number of date labels
    for (let i = 0; i < numLabels; i++) {
        const point = data[Math.floor(i * (data.length - 1) / Math.max(1, numLabels - 1))]; // Handle single point case
        const x = paddingLeft + (point.date.getTime() - minDate) / dateRange * chartWidth;
        const dateStr = point.date.toLocaleDateString(undefined, { month: 'short', day: 'numeric' });
        ctx.fillText(dateStr, x, paddingTop + chartHeight + 5); // Label below X-axis
    }

    // Draw the line chart
    ctx.beginPath();
    ctx.strokeStyle = 'var(--accent)';
    ctx.lineWidth = 2;

    // If there's only one point, draw just the point, not a line
    if (data.length === 1) {
        const dPoint = data[0];
        const x = paddingLeft + (dPoint.date.getTime() - minDate) / dateRange * chartWidth;
        const y = paddingTop + chartHeight - (dPoint.score * yScale);
        ctx.moveTo(x, y); // Move to the point
    } else {
        data.forEach((dPoint, index) => {
            const x = paddingLeft + (dPoint.date.getTime() - minDate) / dateRange * chartWidth;
            const y = paddingTop + chartHeight - (dPoint.score * yScale); // Invert Y for canvas (0 at top)

            if (index === 0) {
                ctx.moveTo(x, y);
            } else {
                ctx.lineTo(x, y);
            }
        });
        ctx.stroke(); // Stroke the line
    }

    // Draw points after the line (or alone if only one point) so they appear on top
    data.forEach((dPoint) => {
        const x = paddingLeft + (dPoint.date.getTime() - minDate) / dateRange * chartWidth;
        const y = paddingTop + chartHeight - (dPoint.score * yScale);
        ctx.beginPath(); // Start new path for each circle
        ctx.arc(x, y, 3 * dpi, 0, Math.PI * 2); // Make points slightly larger for high DPI
        ctx.fillStyle = 'var(--accent)';
        ctx.fill();
    });
}
</script>
</body>
</html>
