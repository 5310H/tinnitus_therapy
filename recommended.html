<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Recommended Therapies</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="stylesheet" href="style.css">
<script src="storage.js"></script>
<script src="nav.js"></script>
</head>
<body>
<div class="panel">
    <h1>Personalized Recommendations</h1>
    <p class="info">Based on your latest assessment scores.</p>

    <div id="resultsArea"></div>

    <div style="margin-top: 2rem;">
        <a href="index.html" class="button">Back to Dashboard</a>
    </div>
</div>

<script>
window.onload = () => {
    initNav("These suggestions are generated based on your THI (distress) and MML (masking level) data. Clinical guidelines suggest prioritizing different modalities depending on symptom severity.");
    renderRecommendations();
    saveSetting('recommendations_viewed', 'true');
};

function renderRecommendations() {
    const area = document.getElementById('resultsArea');
    const data = getTherapyRecommendations();

    if (data.status === 'incomplete') {
        area.innerHTML = `
            <div class="card" style="text-align:center;">
                <p>${data.message}</p>
                <a href="cbt.html" class="big-btn play-btn" style="margin-top:1rem; text-decoration:none;">Go to Assessment</a>
            </div>
        `;
        return;
    }

    let html = `
        <div class="card" style="margin-bottom:20px; background:rgba(0,191,165,0.05); border-color:var(--accent);">
            <h3 style="color:var(--accent); margin-top:0;">Assessment Snapshot</h3>
            <p><strong>Last THI Score:</strong> ${data.thi}/100</p>
            <p><strong>Last MML:</strong> ${data.mml !== null ? data.mml + '%' : 'Not Tested'}</p>
        </div>
        <h2 style="text-align:left; margin-bottom:10px;">Suggested Modes</h2>
    `;

    data.recommendations.forEach(rec => {
        html += `
            <div class="card" style="margin-top:15px;">
                <h3 style="margin-top:0;">${rec.mode}</h3>
                <p class="info" style="margin-bottom:15px; color:var(--text); line-height:1.4;">${rec.reason}</p>
                <a href="${rec.url}" class="button" style="width:100%; border-color:var(--accent);">Open Therapy</a>
            </div>
        `;
    });

    area.innerHTML = html;
}
</script>
</body>
</html>
