<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>UX Improvement Checklist</title>
<style>
    body {
        font-family: Arial, sans-serif;
        background: #f4f4f7;
        padding: 20px;
        line-height: 1.6;
    }
    h1 {
        text-align: center;
        margin-bottom: 20px;
    }
    .section {
        background: white;
        padding: 15px;
        margin-bottom: 15px;
        border-radius: 8px;
        border-left: 5px solid #4a90e2;
    }
    .section h2 {
        margin-top: 0;
        font-size: 20px;
    }
    label {
        display: block;
        margin: 6px 0;
        cursor: pointer;
    }
</style>
</head>
<body>

<h1>UX Improvement Checklist</h1>

<div class="section">
    <h2>Therapy Mode</h2>
    <label><input type="checkbox"> Minimal, calm UI with only essential controls</label>
    <label><input type="checkbox"> Hide advanced settings behind a toggle</label>
</div>

<div class="section">
    <h2>Preset Profiles</h2>
    <label><input type="checkbox"> Add presets (Hiss, Tonal, Reactive, Sleep)</label>
    <label><input type="checkbox"> Save presets using localStorage</label>
</div>

<div class="section">
    <h2>Progress Dashboard</h2>
    <label><input type="checkbox"> Track daily usage time</label>
    <label><input type="checkbox"> Track streaks and session length</label>
</div>

<div class="section">
    <h2>Calibration Wizard</h2>
    <label><input type="checkbox"> 3-step guided setup for comfort level</label>
    <label><input type="checkbox"> Save baseline settings</label>
</div>

<div class="section">
    <h2>Relaxation Layers</h2>
    <label><input type="checkbox"> Add pink/brown noise options</label>
    <label><input type="checkbox"> Add optional ambient loops</label>
</div>

<div class="section">
    <h2>Micro-Help Tooltips</h2>
    <label><input type="checkbox"> Add “?” icons explaining each control</label>
    <label><input type="checkbox"> Keep explanations short and friendly</label>
</div>

<div class="section">
    <h2>A/B Comparison</h2>
    <label><input type="checkbox"> Add toggle for processed vs raw audio</label>
</div>

<div class="section">
    <h2>Sleep Timer</h2>
    <label><input type="checkbox"> Fade-out timer (30–60 minutes)</label>
    <label><input type="checkbox"> Dim UI during sleep mode</label>
</div>

<div class="section">
    <h2>Safe Mode</h2>
    <label><input type="checkbox"> Limit max gain and notch depth</label>
    <label><input type="checkbox"> Smooth transitions to avoid spikes</label>
</div>

<div class="section">
    <h2>Modern CSS Styling</h2>
    <label><input type="checkbox"> Add soft gradients and rounded corners</label>
    <label><input type="checkbox"> Use smooth transitions for sliders</label>
</div>

<div class="section">
    <h2>Preset Export/Import</h2>
    <label><input type="checkbox"> Add JSON export button</label>
    <label><input type="checkbox"> Add JSON import field</label>
</div>

</body>
</html>
