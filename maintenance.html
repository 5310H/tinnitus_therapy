<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Maintenance - Tinnitus Therapy Suite</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" href="icon-192.png" type="image/png">
    <link rel="stylesheet" href="style.css">
    <script src="storage.js"></script>
    <style>
        h1 {
            font-size: 1.8rem;
            color: #ef5350;
            margin-bottom: 0.3rem;
        }

        h2 {
            font-size: 1.2rem;
            margin-bottom: 1rem;
            color: #00bfa5;
        }

        @media (max-width: 600px) {
            h1 {
                font-size: 1.4rem;
            }

            h2 {
                font-size: 1.1rem;
            }
        }
    </style>
</head>

<body
    style="background-color: #000b18; color: #e0e0e0; display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 100vh; margin: 0;">
    <div class="panel" style="max-width: 520px; width: 90%; margin: auto; text-align: center;">
        <h1>Maintenance Mode</h1>
        <div class="card"
            style="background-color: #00162d; padding: 20px; border-radius: 12px; border: 1px solid #ef5350; text-align: center;">
            <div style="font-size: 3rem; margin-bottom: 20px;">🛠️</div>
            <h2>Down for Maintenance</h2>
            <p class="info" style="font-size: 1rem; color: #e0e0e0;">
                We are currently performing maintenance to improve the suite's stability and address reported issues.
            </p>
            <p style="margin-top: 15px; font-weight: bold; color: #00bfa5;">
                Please try again later.
            </p>
            <p style="margin-top: 10px; font-size: 0.85rem; color: #888;">
                Sorry for the inconvenience.
            </p>
        </div>
    </div>
</body>

</html>
